<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flip Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #1a1a1a;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
  font-family: "Bodoni Moda", serif;
}

body {
  margin: 0;
  height: 100vh;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: center;
}

.clock {
  display: flex;
  gap: 24px;
}

.flip-card {
  position: relative;
  width: 260px;
  height: 360px;
  perspective: 1200px;
  background: var(--bg);
  border-radius: 16px;
  overflow: hidden;
}

.flip-card::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: white;
  z-index: 5;
}

/* number stack */
.stack {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.6s ease-in;
}

.num {
  position: absolute;
  width: 100%;
  height: 50%;
  left: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 210px;
  font-weight: 600;
  color: var(--text);
  backface-visibility: hidden;
}

.num.top {
  top: 0;
  background: #181818;
  transform-origin: bottom;
}

.num.bottom {
  bottom: 0;
  background: #2a2a2a;
  transform-origin: top;
  transform: rotateX(180deg);
}

/* labels */
.ampm {
  position: absolute;
  bottom: 8px;
  right: 10px;
  font-size: 22px;
  letter-spacing: 0.2em;
}

.day {
  position: absolute;
  bottom: 8px;
  left: 10px;
  font-size: 22px;
  letter-spacing: 0.18em;
}
</style>
</head>

<body>

<div class="clock">
  <div class="flip-card" id="hours">
    <div class="stack">
      <div class="num top">12</div>
      <div class="num bottom">12</div>
    </div>
    <div class="day" id="day">MON</div>
  </div>

  <div class="flip-card" id="minutes">
    <div class="stack">
      <div class="num top">00</div>
      <div class="num bottom">00</div>
    </div>
    <div class="ampm" id="ampm">AM</div>
  </div>
</div>

<script>
const days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];

function updateCard(card, value) {
  const stack = card.querySelector(".stack");
  const top = stack.querySelector(".top");
  const bottom = stack.querySelector(".bottom");

  if (top.textContent === value) return;

  bottom.textContent = value;
  stack.style.transform = "rotateX(-180deg)";

  setTimeout(() => {
    top.textContent = value;
    stack.style.transition = "none";
    stack.style.transform = "rotateX(0)";
    stack.offsetHeight;
    stack.style.transition = "transform 0.6s ease-in";
  }, 600);
}

function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();

  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  updateCard(document.getElementById("hours"), String(h).padStart(2, "0"));
  updateCard(document.getElementById("minutes"), String(m).padStart(2, "0"));

  document.getElementById("ampm").textContent = ampm;
  document.getElementById("day").textContent = days[now.getDay()];
}

updateClock();
setTimeout(() => {
  updateClock();
  setInterval(updateClock, 60000);
}, (60 - new Date().getSeconds()) * 1000);
</script>

</body>
</html>
