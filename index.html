<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Clock Widget</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;600&display=swap" rel="stylesheet">

<style>
:root {
  --card-bg: #1a1a1a;
  --text: #ffffff;
}

* {
  box-sizing: border-box;
  font-family: "Bodoni Moda", serif;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow: hidden;
  background: transparent;
}

/* SAFE EMBED WRAPPER */
.embed-safe {
  padding: 16px;
  display: flex;
  justify-content: center;
  width: 100%;
}

/* CLOCK */
.clock {
  display: flex;
  gap: clamp(6px, 1.5vw, 12px);
}

/* RESPONSIVE CARD */
.card {
  position: relative;
  width: clamp(140px, 35vw, 250px);
  aspect-ratio: 5 / 7;
  background: var(--card-bg);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Divider */
.card::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 6%;
  right: 6%;
  height: 2px;
  background: white;
}

/* Number */
.number {
  font-size: clamp(96px, 18vw, 180px);
  font-weight: 600;
  color: var(--text);
  line-height: 1;
}

/* Labels */
.day,
.ampm {
  position: absolute;
  bottom: 10px;
  font-size: clamp(12px, 2.5vw, 18px);
  font-weight: 900;
  letter-spacing: 0.15em;
}

.day { left: 14px; }
.ampm { right: 14px; }
</style>
</head>

<body>

<div class="embed-safe">
  <div class="clock">

    <div class="card">
      <div class="number" id="hour">12</div>
      <div class="day" id="day">MON</div>
    </div>

    <div class="card">
      <div class="number" id="minute">00</div>
      <div class="ampm" id="ampm">AM</div>
    </div>

  </div>
</div>

<script>
const days = ["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];

function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();

  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;

  document.getElementById("hour").textContent = String(h).padStart(2,"0");
  document.getElementById("minute").textContent = String(m).padStart(2,"0");
  document.getElementById("ampm").textContent = ampm;
  document.getElementById("day").textContent = days[now.getDay()];
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
